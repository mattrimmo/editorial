<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Pitch Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0c1210; --panel:#141c18; --raised:#1b2621; --line:#2a3830;
  --text:#e9f0eb; --muted:#9fb2a6; --signal:#35d975; --signal-ink:#05160c;
  --amber:#f0b44a; --red:#ff8a8a;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 15px/1.5 var(--font)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.strong{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* top bar and navigation */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.1px}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-right:6px}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 28px;overflow-x:auto}
.nav a,.tabs a{padding:12px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover,.tabs a:hover{color:var(--text)}
.nav a.on,.tabs a.on{color:var(--text);border-bottom-color:var(--signal)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--amber);color:#1c1200;font-size:12px;font-weight:700;text-align:center}
.count.signal{background:var(--signal);color:var(--signal-ink)}

/* buttons and form controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3d5246}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);background:var(--raised)}
.btn.danger{background:transparent;border-color:#5b3030;color:var(--red)}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=password],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
input::placeholder,textarea::placeholder{color:#62756a}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text);margin:0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--signal)}

/* page heads */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.lede{color:var(--muted);margin:0;max-width:60ch}

/* record list */
.list{border-top:1px solid var(--line)}
.row{display:flex;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line)}
a.row:hover{background:var(--panel)}
.art{width:52px;height:52px;border-radius:8px;background:var(--raised);object-fit:cover;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--muted);font-size:14px}
.strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:999px;background:var(--raised);font-size:13px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}
.pill.good{background:rgba(53,217,117,.14);color:var(--signal)}
.pill.wait{background:rgba(240,180,74,.14);color:var(--amber)}
.pill.bad{background:rgba(255,138,138,.14);color:var(--red)}
.chev{flex:none;color:var(--muted)}

/* callouts and empty states */
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:rgba(240,180,74,.1);color:#f6d79a;margin-bottom:20px;font-size:14px}
.callout.error{background:rgba(255,138,138,.1);color:#ffc0c0}
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.empty h2{font-size:20px;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:52ch}

/* record page */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);margin-bottom:16px;font-size:14px;padding:4px 0}
.back:hover{color:var(--text)}
.rec-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.rec-head .art{width:84px;height:84px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--panel);border-radius:12px;padding:14px 16px}
.tile .v{font-size:24px;font-weight:700;line-height:1.2}
.tile .l{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.section{margin-bottom:32px}

/* pitch builder */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:4px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;line-height:1.25}
.seg-btn small{font-size:11px;color:var(--muted);font-weight:400}
.seg-btn:hover{border-color:#3d5246}
.seg-btn[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.seg-btn[aria-pressed=true] small{color:#0b3a1d}
.step-title{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;font-size:17px;font-weight:600}
.step-title .n{color:var(--signal);font-weight:700}
.paper{background:#f3f6f3;color:#0f1612;border-radius:12px;padding:20px 22px}
.paper label{color:#5a6a60}
.paper input,.paper textarea{background:transparent;border:0;border-bottom:1px solid #cfd8d1;border-radius:0;padding:6px 0;color:#0f1612;min-height:0}
.paper input:focus,.paper textarea:focus{outline:none;border-bottom-color:#1f9d55}
.paper textarea{border:0;line-height:1.6;resize:vertical;min-height:300px;font-size:15px;padding:8px 0}
.paper .subj{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.paper .subj>div{flex:1}
details.more{margin:8px 0 16px;color:var(--muted)}
details.more summary{cursor:pointer;padding:6px 0;font-size:14px}
details.more[open] summary{margin-bottom:10px}

/* tables and lists */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:13px}
tr.live td{background:rgba(53,217,117,.05)}
.add{color:var(--signal);font-size:12px;margin-left:4px}
.rem{color:var(--red);font-size:12px;margin-left:4px}
.dim{color:#4a5c51}
.pl{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl img,.pl .ph{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--raised);flex:none}
.pl .n{flex:1;min-width:0}
.pl .n div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-title{margin:24px 0 4px;font-weight:600;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:var(--panel);font-size:14px}
.chip .u{color:var(--signal)}
.chip .d{color:var(--muted)}

/* follow-ups and sorting */
.task{display:flex;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line)}
.task .main{flex:1;min-width:0}
.sort-row .btns{display:flex;gap:8px;flex:none}

/* highlights */
.hl-pick{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin:-8px 0 16px}
.hl-pick label{margin:0}
.hl-pick select{width:auto;min-width:240px}
.hero{background:var(--panel);border-left:4px solid var(--signal);border-radius:0 12px 12px 0;padding:20px 24px;margin-bottom:32px}
.hero h2{margin:0 0 6px;color:var(--muted);font-size:14px;font-weight:500}
.hero-text{font-size:24px;line-height:1.3;font-weight:700;margin:0;max-width:34ch}
.hero-more{margin:12px 0 0;font-size:14px}
.tiles4{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding:0}
.bar{flex:1;background:#33443a;border-radius:2px 2px 0 0;min-height:3px}
.bar.on{background:var(--signal)}
.dsp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dsp-card{background:var(--panel);border-radius:12px;padding:16px 18px}
.dsp-card h3{margin:0 0 8px;font-size:16px;font-weight:600}
.dsp-main{font-size:15px}
.dsp-card .chip{background:var(--raised)}
.dsp-chart{margin-top:10px;font-size:14px;color:var(--text)}
/* picking several records */
.row.pick{cursor:pointer}
.row.pick:hover{background:var(--panel)}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--signal-ink);font-weight:700;font-size:14px}
.box.on{background:var(--signal);border-color:var(--signal)}
.selbar{position:sticky;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:12px 16px;background:var(--raised);border:1px solid var(--line);border-radius:12px}
/* dialogs */
#modal{position:fixed;inset:0;background:rgba(5,9,7,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:30;overflow-y:auto}
#modal.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:24px}
.dialog h2{font-size:20px;margin-bottom:6px}
.dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
#toast.err{border-color:#7a2d2d;color:#ffc0c0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:720px){
  .wrap{padding:0 14px}
  .strip{display:none}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
  .tiles4{grid-template-columns:1fr 1fr}
  .dsp-grid{grid-template-columns:1fr}
  .hero-text{font-size:20px}
  .hl-pick{justify-content:flex-start}
  .hl-pick select{min-width:0;width:100%}
  .tile{padding:12px}
  .tile .v{font-size:19px}
  .tile .l{font-size:12px}
  .sort-row .main{flex:1 1 calc(100% - 80px)}
  .sort-row .btns{flex:1 1 100%;flex-wrap:wrap}
  .grid2,.grid4{grid-template-columns:1fr}
  .rec-head .art{width:64px;height:64px}
  h1{font-size:22px}
  .task,.sort-row{flex-wrap:wrap}
  .status{display:none}
  .paper{padding:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/records">Editorial Pitch Pack</a>
    <div class="top-right">
      <span class="status" id="synced"></span>
      <button class="btn quiet small" data-act="sync" id="syncBtn">Refresh data</button>
      <button class="btn quiet small" data-act="openSettings">Settings</button>
    </div>
  </div>
</header>
<main class="wrap" style="padding-top:8px;padding-bottom:96px">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div id="banner"></div>
  <div id="view"></div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Core;
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG') t.style.visibility = 'hidden'; }, true);
  var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var state = {
    tracked: { tracks: [] }, history: { generated_at: null, records: {} },
    registry: { playlists: {} }, manual: { entries: {} }, pitches: { pitches: {} }, resolved: { entries: {} },
    ui: { view: 'records', rec: null, tab: 'highlights', hl: {}, pitch: {}, modal: null, logOpen: false, selecting: false, sel: [], bundle: { dsp: 'spotify', name: '', followUp: false } },
    loadError: null, syncing: false
  };

  // ------------------------------------------------------------ routing (so Back and bookmarks work)
  function readHash() {
    var p = location.hash.replace(/^#\/?/, '').split('/');
    if (p[0] === 'record' && p[1]) { state.ui.view = 'record'; state.ui.rec = decodeURIComponent(p[1]); state.ui.tab = ['highlights', 'pitch', 'progress', 'playlists', 'details'].indexOf(p[2]) >= 0 ? p[2] : 'highlights'; }
    else if (p[0] === 'bundle') state.ui.view = 'bundle';
    else if (p[0] === 'followups') state.ui.view = 'followups';
    else if (p[0] === 'sort') state.ui.view = 'sort';
    else state.ui.view = 'records';
  }
  function go(path) { var h = '#/' + path; if (location.hash === h) { render(); } else { location.hash = h; } }
  window.addEventListener('hashchange', function () { readHash(); state.ui.logOpen = false; render(); window.scrollTo(0, 0); });

  // ------------------------------------------------------------ settings and GitHub
  var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  function detectRepo() {
    var host = location.hostname, parts = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(host)) return { owner: host.split('.')[0], repo: parts[0] || '' };
    return { owner: '', repo: '' };
  }
  function cfg() {
    var d = detectRepo();
    return { token: LS.get('epp_token'), owner: LS.get('epp_owner') || d.owner, repo: LS.get('epp_repo') || d.repo, branch: LS.get('epp_branch') || 'main' };
  }
  function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function ghFetch(path, opts) {
    var c = cfg();
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
    return fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + path, opts);
  }
  function needToken() {
    var c = cfg();
    if (!c.token || !c.owner || !c.repo) { toast('Connect GitHub first. Open Settings and paste your token.', true); openModal('settings'); return true; }
    return false;
  }
  // Read-modify-write one JSON file in the repo, retrying if something else changed it meanwhile.
  async function mutateFile(path, mutator) {
    var c = cfg();
    for (var attempt = 0; attempt < 4; attempt++) {
      var meta = await ghFetch('/contents/' + path + '?ref=' + encodeURIComponent(c.branch));
      if (!meta.ok) throw new Error('Could not read ' + path + ' (' + meta.status + ')');
      var info = await meta.json();
      var raw = await ghFetch('/contents/' + path + '?ref=' + encodeURIComponent(c.branch), { headers: { 'Accept': 'application/vnd.github.raw+json' } });
      var obj = JSON.parse(await raw.text());
      var next = mutator(obj) || obj;
      var put = await ghFetch('/contents/' + path, { method: 'PUT', body: JSON.stringify({ message: 'Update ' + path + ' from page', content: utf8ToB64(JSON.stringify(next, null, 1) + '\n'), sha: info.sha, branch: c.branch }) });
      if (put.ok) return next;
      if (put.status !== 409 && put.status !== 422) throw new Error('Save failed (' + put.status + ')');
    }
    throw new Error('Save kept conflicting. Try again in a moment.');
  }

  // ------------------------------------------------------------ loading
  function getJSON(path) {
    return fetch(path + '?t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); });
  }
  async function loadAll() {
    try {
      var r = await Promise.all(['tracked', 'history', 'registry', 'manual', 'pitches'].map(function (n) { return getJSON('data/' + n + '.json'); }));
      state.tracked = r[0]; state.history = r[1]; state.registry = r[2]; state.manual = r[3]; state.pitches = r[4];
      state.resolved = await getJSON('data/resolved.json').catch(function () { return { entries: {} }; });
      state.loadError = null;
    } catch (e) {
      state.loadError = 'The data files could not be loaded (' + e.message + '). Open this from your GitHub Pages address rather than from a file on your computer.';
    }
    render();
  }

  // ------------------------------------------------------------ data helpers
  function today() { return C.todayUTC(); }
  // Records added by link have no ISRC until the sync matches them (data/resolved.json).
  function resolvedFor(e) { return ((state.resolved.entries || {})[e.key || e.link || ''] || {}); }
  function entryIsrc(e) { return e.isrc || resolvedFor(e).isrc || ''; }
  function allItems() {
    var t = today(), seen = {}, out = [];
    (state.tracked.tracks || []).forEach(function (e) {
      var isrc = entryIsrc(e);
      if (!isrc) { out.push({ pending: true, key: e.key || e.link, link: e.link || e.key, error: resolvedFor(e).error || null, release: 9e15 }); return; }
      if (seen[isrc]) return;
      seen[isrc] = 1;
      var entry = Object.assign({}, e, { isrc: isrc });
      out.push(C.buildContext(entry, state.history.records[isrc], (state.manual.entries || {})[isrc] || [], state.registry.playlists || {}, t));
    });
    return out.sort(function (a, b) { return (b.release || 0) - (a.release || 0); });
  }
  function contexts() { return allItems().filter(function (i) { return !i.pending; }); }
  function ctxFor(isrc) { return contexts().filter(function (c) { return c.isrc === isrc; })[0]; }
  function pitchState(ctx) {
    var s = state.ui.pitch[ctx.isrc];
    if (!s) s = state.ui.pitch[ctx.isrc] = { dsp: 'spotify', week: null, followUp: null, name: '', playlist: '' };
    return s;
  }
  function lastPitched(isrc, dsp) { return ((state.pitches.pitches || {})[isrc] || {})[dsp] || null; }
  function title(ctx) { return (ctx.artist || '(waiting for first refresh)') + (ctx.track ? ' - ' + ctx.track : ''); }
  function collectUntagged(ctxs) {
    var seen = {}, out = [], order = C.DSPS.map(function (d) { return d.key; });
    ctxs.forEach(function (ctx) {
      C.needsTagging(ctx.placements).forEach(function (p) {
        var k = p.dsp + ':' + p.id;
        if (!seen[k]) { seen[k] = { key: k, dsp: p.dsp, id: p.id, name: p.name, artwork: p.artwork, followers: p.followers, regions: {}, records: [] }; out.push(seen[k]); }
        seen[k].records.push(ctx.track || ctx.isrc);
        (p.spans || []).forEach(function (s) { if (s.cc) seen[k].regions[s.cc] = 1; });
      });
    });
    out.sort(function (a, b) { return order.indexOf(a.dsp) - order.indexOf(b.dsp) || (b.followers || 0) - (a.followers || 0) || String(a.name).localeCompare(String(b.name)); });
    return out;
  }
  function followUpItems(ctxs) {
    var out = [];
    ctxs.forEach(function (ctx) {
      C.followUps(ctx, (state.pitches.pitches || {})[ctx.isrc] || {}).forEach(function (f) { if (!f.never && f.count > 0) out.push({ ctx: ctx, f: f }); });
    });
    return out;
  }
  function toast(msg, err) {
    var el = $('#toast'); el.textContent = msg; el.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = ''; }, err ? 6000 : 2600);
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    return fallback();
    function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed. Select the text and copy it by hand.', true); } ta.remove(); }
  }
  function ago(iso) {
    if (!iso) return 'never';
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 2) return 'just now'; if (m < 90) return m + ' minutes ago';
    var h = Math.round(m / 60); if (h < 36) return h + ' hours ago';
    return Math.round(h / 24) + ' days ago';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  // ------------------------------------------------------------ render
  function render() {
    var items = allItems(), ctxs = items.filter(function (i) { return !i.pending; });
    var untagged = collectUntagged(ctxs), fu = followUpItems(ctxs);
    $('#synced').textContent = state.history.generated_at ? 'Updated ' + ago(state.history.generated_at) : 'Not refreshed yet';
    var sb = $('#syncBtn'); sb.disabled = state.syncing; sb.textContent = state.syncing ? 'Refreshing...' : 'Refresh data';
    $('#banner').innerHTML = state.loadError ? '<div class="callout error"><span>' + esc(state.loadError) + '</span></div>' : '';

    var view = state.ui.view;
    var navView = (view === 'record' || view === 'bundle') ? 'records' : view;
    var nav = [['records', 'Records', 0], ['followups', 'Follow-ups', fu.length, 'signal'], ['sort', 'Sort playlists', untagged.length]];
    $('#nav').innerHTML = nav.map(function (n) {
      return '<a href="#/' + n[0] + '" class="' + (navView === n[0] ? 'on' : '') + '"' + (navView === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + (n[2] ? '<span class="count ' + (n[3] || '') + '">' + n[2] + '</span>' : '') + '</a>';
    }).join('');

    var v = $('#view');
    if (view === 'record') {
      var ctx = ctxs.filter(function (c) { return c.isrc === state.ui.rec; })[0];
      if (!ctx) { v.innerHTML = '<div class="empty"><h2>That record is not here</h2><p>It may have been removed, or the data is still loading.</p><a class="btn" href="#/records">Back to records</a></div>'; }
      else { v.innerHTML = viewRecord(ctx); if (state.ui.tab === 'pitch') updatePitch(ctx); }
    } else if (view === 'bundle') { v.innerHTML = viewBundle(ctxs); if ($('#p_body')) updateBundle(ctxs); }
    else if (view === 'followups') v.innerHTML = viewFollowUps(fu, ctxs);
    else if (view === 'sort') v.innerHTML = viewSort(untagged);
    else v.innerHTML = viewRecords(items);
    renderModal();
  }

  // ---- records list
  function viewRecords(items) {
    var c = cfg();
    var sel = state.ui.selecting;
    var head = '<div class="page-head"><div><h1>' + (sel ? 'Choose records for one email' : 'Records') + '</h1><p class="lede">' + (sel ? 'Tick up to four records. They go in one email, strongest first.' : 'Pick a record to build a pitch for an editor.') + '</p></div>' +
      (sel ? '<button class="btn quiet" data-act="cancelSelect">Cancel</button>' : '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="startSelect">Pitch several records</button><button class="btn primary" data-act="openAdd">Add record</button></div>') + '</div>';
    var banner = !c.token ? '<div class="callout"><span>GitHub is not connected yet, so you can look around but not add records or save changes.</span><button class="btn small" data-act="openSettings">Connect GitHub</button></div>' : '';
    if (!items.length) {
      return head + banner + '<div class="empty"><h2>Add your first record</h2><p>Paste a Spotify track link. The app finds the same record on Apple Music and Deezer, lists the editorial playlists it is on, and drafts a short pitch for each editor.</p><button class="btn primary" data-act="openAdd">Add record</button></div>';
    }
    var bar = sel ? '<div class="selbar"><span>' + plural(state.ui.sel.length, 'record') + ' chosen</span><button class="btn primary" data-act="openBundle"' + (state.ui.sel.length < 2 ? ' disabled' : '') + '>Write one email</button></div>' : '';
    return head + banner + '<div class="list">' + items.map(function (i) { return recRow(i, sel); }).join('') + '</div>' + bar;
  }
  function recRow(ctx, sel) {
    if (ctx.pending) {
      var msg = ctx.error ? ctx.error : 'Waiting for the next refresh to find this record. Refresh data does it straight away.';
      return '<div class="row"><div class="art"></div><div class="row-main"><div class="row-title" style="white-space:normal;word-break:break-all">' + esc(ctx.link) + '</div><div class="row-sub">' + esc(msg) + '</div></div>' +
        '<span class="pill ' + (ctx.error ? 'bad' : 'wait') + '">' + (ctx.error ? 'Not found' : 'Finding record') + '</span><button class="btn quiet small" data-act="removePending" data-key="' + esc(ctx.key) + '">Remove</button></div>';
    }
    var ed = C.editorialOnly(ctx.placements).filter(C.activeNow);
    var pills = C.DSPS.map(function (d) {
      var n = ed.filter(function (p) { return p.dsp === d.key; }).length;
      return n ? '<span class="pill"><span>' + d.label + '</span><b>' + n + '</b></span>' : '';
    }).join('');
    var wk = ctx.weeks.filter(function (w) { return w.n === ctx.defaultWeek; })[0];
    var fresh = wk && wk.totalAdded ? '<span class="pill good">' + wk.totalAdded + ' new in week ' + wk.n + '</span>' : '';
    var sub;
    if (ctx.release == null) sub = 'No release date yet';
    else if (C.weekOf(ctx.release, today()) < 1) sub = 'Out ' + C.fmtLong(ctx.release);
    else sub = 'Week ' + C.weekOf(ctx.release, today()) + ', released ' + C.fmtLong(ctx.release);
    if (!ed.length) sub += '. No editorial playlists yet';
    if (sel) {
      var on = state.ui.sel.indexOf(ctx.isrc) >= 0;
      return '<div class="row pick" role="checkbox" aria-checked="' + on + '" tabindex="0" data-act="toggleSel" data-isrc="' + esc(ctx.isrc) + '"><span class="box' + (on ? ' on' : '') + '" aria-hidden="true">' + (on ? '&#10003;' : '') + '</span>' +
        '<div class="row-main"><div class="row-title">' + esc(title(ctx)) + '</div><div class="row-sub">' + esc(sub) + '</div></div><div class="strip">' + fresh + pills + '</div></div>';
    }
    return '<a class="row" href="#/record/' + encodeURIComponent(ctx.isrc) + '">' +
      (ctx.artwork ? '<img class="art" src="' + esc(ctx.artwork) + '" alt="" loading="lazy">' : '<div class="art"></div>') +
      '<div class="row-main"><div class="row-title">' + esc(title(ctx)) + '</div><div class="row-sub">' + esc(sub) + '</div></div>' +
      '<div class="strip">' + fresh + pills + '</div>' + CHEV + '</a>';
  }

  // ---- one email for several records
  function bundleCtxs(ctxs) {
    return state.ui.sel.map(function (id) { return ctxs.filter(function (c) { return c.isrc === id; })[0]; }).filter(Boolean);
  }
  function viewBundle(ctxs) {
    var list = bundleCtxs(ctxs), b = state.ui.bundle;
    if (list.length < 2) return '<div class="empty"><h2>Choose at least two records</h2><p>Tick the records you want in one email on the Records page.</p><a class="btn" href="#/records">Back to records</a></div>';
    var seg = C.DSPS.map(function (d) {
      return '<button type="button" class="seg-btn" data-act="bdsp" data-dsp="' + d.key + '" aria-pressed="' + (b.dsp === d.key) + '"><span>' + d.label + '</span></button>';
    }).join('');
    var rows = list.map(function (c, i) {
      return '<div class="task"><div class="main"><div class="strong">' + (i + 1) + '. ' + esc(title(c)) + '</div></div>' +
        '<button class="btn quiet small" data-act="moveSel" data-isrc="' + esc(c.isrc) + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move up">Up</button>' +
        '<button class="btn quiet small" data-act="moveSel" data-isrc="' + esc(c.isrc) + '" data-dir="1"' + (i === list.length - 1 ? ' disabled' : '') + ' aria-label="Move down">Down</button>' +
        '<button class="btn quiet small" data-act="dropSel" data-isrc="' + esc(c.isrc) + '">Remove</button></div>';
    }).join('');
    return '<a class="back" href="#/records">' + BACK + 'All records</a>' +
      '<div class="page-head"><div><h1>One email, ' + list.length + ' records</h1><p class="lede">Each record gets a short block of its own. Put the strongest first.</p></div></div>' +
      '<div class="section"><div class="list">' + rows + '</div></div>' +
      '<div class="section"><h2 class="step-title"><span class="n">1</span>Who are you emailing?</h2><div class="seg" role="group" aria-label="Editor">' + seg + '</div></div>' +
      '<div class="section"><h2 class="step-title"><span class="n">2</span>Make it personal</h2>' +
      '<div class="field" style="max-width:320px"><label for="p_name">Their first name</label><input id="p_name" value="' + esc(b.name) + '" placeholder="e.g. Sam"></div>' +
      '<label class="check"><input type="checkbox" id="p_fu"' + (b.followUp ? ' checked' : '') + '>Write it as a follow-up</label></div>' +
      '<div class="section"><h2 class="step-title"><span class="n">3</span>Copy your email</h2>' +
      '<div class="paper"><div class="subj"><div><label for="p_subj">Subject</label><input id="p_subj"></div><button class="btn small" data-act="copySubj" style="background:#e2e9e4;color:#0f1612;border-color:#cfd8d1">Copy subject</button></div>' +
      '<label for="p_body">Message</label><textarea id="p_body" rows="22"></textarea></div><div id="p_warn"></div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px"><button class="btn primary" data-act="copyBody">Copy email</button></div></div>' +
      '<div class="section"><h2>After you send it</h2><button class="btn" data-act="markAllPitched">Mark all ' + list.length + ' as pitched to ' + esc(C.DSP_LABEL[b.dsp]) + '</button></div>';
  }
  function updateBundle(ctxs) {
    var b = state.ui.bundle, list = bundleCtxs(ctxs);
    b.name = $('#p_name').value; b.followUp = $('#p_fu').checked;
    var p = C.buildMultiPitch(list, b.dsp, { name: b.name.trim() || null, followUp: b.followUp });
    $('#p_subj').value = p.subject; $('#p_body').value = p.body;
    $('#p_warn').innerHTML = p.missing.length ? '<div class="callout" style="margin:16px 0 0"><span>No ' + esc(p.label) + ' link yet for ' + esc(p.missing.join(', ')) + ', so the email says [link] there. Add it on each record\'s Details tab.</span></div>' : '';
  }

  // ---- one record
  function viewRecord(ctx) {
    var tabs = [['highlights', 'Highlights'], ['pitch', 'Email draft'], ['progress', 'Progress'], ['playlists', 'Playlists'], ['details', 'Details']];
    var ed = C.editorialOnly(ctx.placements).filter(C.activeNow);
    var tiles = '';
    if (ctx.release != null) {
      var n = ctx.defaultWeek, s = C.weekStart(ctx.release, n), e = Math.min(C.weekEnd(ctx.release, n), today());
      var wk = ctx.weeks.filter(function (w) { return w.n === n; })[0];
      var st = C.seriesSum(ctx.streams, s, e), pv = n > 1 ? C.seriesSum(ctx.streams, C.weekStart(ctx.release, n - 1), C.weekEnd(ctx.release, n - 1)) : null;
      var pc = st && pv ? C.pctChange(st.sum, pv.sum) : null;
      tiles = '<div class="tiles">' +
        '<div class="tile"><div class="v num">' + ed.length + '</div><div class="l">Editorial playlists live now</div></div>' +
        '<div class="tile"><div class="v num">' + (wk ? wk.totalAdded : 0) + '</div><div class="l">Added in week ' + n + '</div></div>' +
        '<div class="tile"><div class="v num">' + (st ? C.fmtNum(st.sum) : '-') + (pc != null ? ' <span class="' + (pc >= 0 ? 'add' : 'rem') + '" style="font-size:14px">' + (pc >= 0 ? '+' : '') + pc + '%</span>' : '') + '</div><div class="l">Spotify streams in week ' + n + '</div></div></div>';
    }
    var issues = ctx.errors && ctx.errors.length ? '<div class="callout" title="' + esc(ctx.errors.join('\n')) + '"><span>' + plural(ctx.errors.length, 'item') + ' could not be refreshed last time. Older data is shown where possible.</span></div>' : '';
    var sub = ctx.release != null ? (C.weekOf(ctx.release, today()) < 1 ? 'Out ' + C.fmtLong(ctx.release) : 'Week ' + C.weekOf(ctx.release, today()) + ', released ' + C.fmtLong(ctx.release)) : 'No release date yet';
    var body = state.ui.tab === 'highlights' ? tabHighlights(ctx) : state.ui.tab === 'progress' ? tabProgress(ctx) : state.ui.tab === 'playlists' ? tabPlaylists(ctx) : state.ui.tab === 'details' ? tabDetails(ctx) : tabPitch(ctx);
    return '<a class="back" href="#/records">' + BACK + 'All records</a>' +
      '<div class="rec-head">' + (ctx.artwork ? '<img class="art" src="' + esc(ctx.artwork) + '" alt="">' : '<div class="art"></div>') +
      '<div><h1>' + esc(title(ctx)) + '</h1><div class="muted">' + esc(sub) + '</div></div></div>' + issues + (state.ui.tab === 'highlights' ? '' : tiles) +
      '<nav class="tabs" aria-label="Record sections">' + tabs.map(function (t) {
        return '<a href="#/record/' + encodeURIComponent(ctx.isrc) + '/' + t[0] + '" class="' + (state.ui.tab === t[0] ? 'on' : '') + '">' + t[1] + '</a>';
      }).join('') + '</nav>' + body;
  }

  function weekOptions(ctx, selected) {
    var o = '';
    if (ctx.release == null) return '<option value="1">Week 1</option>';
    for (var n = Math.max(1, C.weekOf(ctx.release, today())); n >= 1; n--) {
      o += '<option value="' + n + '"' + (selected === n ? ' selected' : '') + '>Week ' + n + ' (' + C.fmtShort(C.weekStart(ctx.release, n)) + ' to ' + C.fmtShort(C.weekEnd(ctx.release, n)) + ')' + (n === ctx.defaultWeek ? ', latest full week' : '') + '</option>';
    }
    return o;
  }
  function tabHighlights(ctx) {
    if (ctx.release == null) return '<div class="callout"><span>This record has no release date yet, so there are no weeks to summarise. It arrives with the next refresh, or set one under Details.</span></div>';
    var n = state.ui.hl[ctx.isrc] || ctx.defaultWeek, hl = C.highlights(ctx, n), st = hl.streams;
    var up = function (p) { return p == null ? '' : ' <span class="' + (p >= 0 ? 'add' : 'rem') + '" style="font-size:14px">' + (p >= 0 ? '+' : '') + p + '%</span>'; };
    var picker = '<div class="hl-pick"><label for="h_week">Showing</label><select id="h_week">' + weekOptions(ctx, n) + '</select></div>';
    var hero = '<div class="hero"><h2>Top thing in week ' + n + '</h2>' +
      (hl.top ? '<p class="hero-text">' + esc(hl.top.text) + '</p>' : '<p class="hero-text muted">Nothing stands out yet in week ' + n + '. Streams and platforms are below.</p>') +
      (hl.others.length ? '<p class="muted hero-more">Also in week ' + n + ': ' + hl.others.map(function (o) { return esc(o.text); }).join('. ') + '.</p>' : '') + '</div>';
    var tiles = '<div class="tiles tiles4">' +
      '<div class="tile"><div class="v num">' + (st.total != null ? C.fmtNum(st.total) : '-') + '</div><div class="l">Spotify streams since release</div></div>' +
      '<div class="tile"><div class="v num">' + (st.week != null ? C.fmtNum(st.week) : '-') + up(st.pct) + '</div><div class="l">Week ' + n + (st.partial ? ' so far' : '') + (st.pct != null ? ', daily average vs last week' : '') + '</div></div>' +
      '<div class="tile"><div class="v num">' + (st.best ? C.fmtNum(st.best.value) : '-') + '</div><div class="l">Best day' + (st.best ? ', ' + C.fmtShort(st.best.date) : '') + '</div></div>' +
      '<div class="tile"><div class="v num">' + (st.shazams != null ? C.fmtNum(st.shazams) : '-') + up(st.shazamPct) + '</div><div class="l">Shazams in week ' + n + '</div></div></div>';
    var max = Math.max.apply(null, st.daily.map(function (d) { return d.value; }).concat([1]));
    var bars = st.daily.length ? '<div class="bars" role="img" aria-label="Daily Spotify streams, most recent 28 days">' + st.daily.map(function (d) {
      return '<span class="bar' + (d.inWeek ? ' on' : '') + '" style="height:' + Math.max(3, Math.round(d.value / max * 100)) + '%" title="' + esc(C.fmtShort(d.date) + ': ' + C.fmtNum(d.value)) + '"></span>';
    }).join('') + '</div><p class="muted" style="font-size:13px;margin:6px 0 0">Daily Spotify streams. Week ' + n + ' is in green.</p>' : '';
    var cards = hl.dsps.length ? '<div class="dsp-grid">' + hl.dsps.map(function (d) {
      var bits = '';
      if (d.key !== 'shazam') {
        bits += '<div class="dsp-main">' + (d.liveCount ? '<b class="num">' + d.liveCount + '</b> editorial playlist' + (d.liveCount === 1 ? '' : 's') + ' live' : '<span class="muted">No editorial playlists yet</span>') + (d.addedCount ? ' <span class="add">+' + d.addedCount + ' in week ' + n + '</span>' : '') + '</div>';
        if (d.liveNames.length) bits += '<div class="chips" style="margin-top:8px">' + d.liveNames.slice(0, 6).map(function (nm) { return '<span class="chip">' + esc(nm) + '</span>'; }).join('') + (d.liveNames.length > 6 ? '<span class="chip muted">+' + (d.liveNames.length - 6) + ' more</span>' : '') + '</div>';
      }
      if (d.chart) bits += '<div class="dsp-chart">' + esc(d.chart) + (d.chartMore ? ' <span class="muted">and ' + d.chartMore + ' more</span>' : '') + '</div>';
      return '<div class="dsp-card"><h3>' + esc(d.label) + '</h3>' + bits + '</div>';
    }).join('') + '</div>' : '<div class="empty" style="padding:32px"><p style="margin:0">No editorial playlists or chart positions yet.</p></div>';
    return picker + hero + '<div class="section"><h2>Streams</h2>' + tiles + bars + '</div><div class="section"><h2>By platform</h2>' + cards + '</div>';
  }

  function tabPitch(ctx) {
    var s = pitchState(ctx), last = lastPitched(ctx.isrc, s.dsp);
    var seg = C.DSPS.map(function (d) {
      var l = lastPitched(ctx.isrc, d.key);
      return '<button type="button" class="seg-btn" data-act="pdsp" data-dsp="' + d.key + '" aria-pressed="' + (s.dsp === d.key) + '"><span>' + d.label + '</span>' + (l ? '<small>pitched ' + C.fmtShort(C.parseDate(l)) + '</small>' : '') + '</button>';
    }).join('');
    var weekOpts = '';
    if (ctx.release != null) {
      for (var n = Math.max(1, C.weekOf(ctx.release, today())); n >= 1; n--) {
        weekOpts += '<option value="' + n + '"' + ((s.week || ctx.defaultWeek) === n ? ' selected' : '') + '>Week ' + n + ' (' + C.fmtShort(C.weekStart(ctx.release, n)) + ' to ' + C.fmtShort(C.weekEnd(ctx.release, n)) + ')' + (n === ctx.defaultWeek ? ', suggested' : '') + '</option>';
      }
    } else weekOpts = '<option value="1">Week 1</option>';
    var fu = s.followUp == null ? !!last : s.followUp;
    return '<div class="section"><h2 class="step-title"><span class="n">1</span>Who are you emailing?</h2><div class="seg" role="group" aria-label="Editor">' + seg + '</div><p class="muted" style="font-size:14px;margin:10px 0 0">Same headline numbers for every editor. This only picks their link.</p></div>' +
      '<div class="section"><h2 class="step-title"><span class="n">2</span>Make it personal</h2>' +
      '<div class="field" style="max-width:320px"><label for="p_name">Their first name</label><input id="p_name" value="' + esc(s.name) + '" placeholder="e.g. Sam"></div>' +
      '<label class="check"><input type="checkbox" id="p_fu"' + (fu ? ' checked' : '') + '>Write it as a follow-up</label>' +
      '<details class="more"><summary>Report on a different week</summary><label for="p_week">Week to talk about</label><select id="p_week">' + weekOpts + '</select></details></div>' +
      '<div class="section"><h2 class="step-title"><span class="n">3</span>Copy your email</h2>' +
      '<div class="paper"><div class="subj"><div><label for="p_subj">Subject</label><input id="p_subj"></div><button class="btn small" data-act="copySubj" style="background:#e2e9e4;color:#0f1612;border-color:#cfd8d1">Copy subject</button></div>' +
      '<label for="p_body">Message</label><textarea id="p_body" rows="14"></textarea></div>' +
      '<div id="p_warn"></div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px"><button class="btn primary" data-act="copyBody">Copy email</button><span class="muted" id="p_note" style="font-size:14px"></span></div></div>' +
      '<div class="section"><h2>After you send it</h2><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" data-act="markPitched">Mark as pitched to ' + esc(C.DSP_LABEL[s.dsp]) + '</button><span class="muted" id="p_last" style="font-size:14px"></span></div>' +
      '<p class="muted" style="font-size:14px;margin:10px 0 0">Logging it means this record shows up under Follow-ups when more editorial playlists add it.</p></div>';
  }

  function updatePitch(ctx) {
    var wk = $('#p_week'); if (!wk) return;
    var s = pitchState(ctx);
    s.week = parseInt(wk.value, 10) || ctx.defaultWeek;
    s.name = $('#p_name').value; s.followUp = $('#p_fu').checked;
    var p = C.buildPitch(ctx, s.dsp, { weekN: s.week, followUp: s.followUp, name: s.name.trim() || null });
    $('#p_subj').value = p.subject; $('#p_body').value = p.body;
    $('#p_note').textContent = p.framing.length ? 'How the numbers are framed: ' + p.framing.join('. ') + '.' : 'No numbers to report yet, so the email is only your hook line.';
    $('#p_warn').innerHTML = p.missingLink ? '<div class="callout" style="margin:16px 0 0"><span>There is no ' + esc(p.label) + ' link for this record yet, so the email says [link].</span><a class="btn small" href="#/record/' + encodeURIComponent(ctx.isrc) + '/details">Add the link</a></div>' : '';
    var last = lastPitched(ctx.isrc, s.dsp);
    $('#p_last').textContent = last ? 'Last pitched to ' + p.label + ' on ' + C.fmtLong(C.parseDate(last)) : 'Not logged as pitched to ' + p.label + ' yet';
  }

  function tabProgress(ctx) {
    if (ctx.release == null) return '<div class="callout"><span>This record has no release date yet, so weeks cannot be worked out. It arrives with the next refresh, or set one under Details.</span></div>';
    var vis = C.DSPS.filter(function (d) { return ctx.weeks.some(function (w) { var c = w.perDsp[d.key]; return c.active || c.added || c.removed; }); });
    var t = today();
    var table;
    if (!vis.length) table = '<div class="empty" style="padding:32px"><p style="margin:0">No editorial playlists have held this record yet.</p></div>';
    else {
      var head = '<tr><th>Week</th>' + vis.map(function (d) { return '<th>' + d.label + '</th>'; }).join('') + '<th>All editorial</th><th>Spotify streams</th></tr>';
      var rows = ctx.weeks.slice().reverse().map(function (w) {
        var cells = vis.map(function (d) {
          var c = w.perDsp[d.key];
          if (!c.active && !c.added && !c.removed) return '<td class="dim">-</td>';
          return '<td class="num">' + c.active + (c.added ? '<span class="add">+' + c.added + '</span>' : '') + (c.removed ? '<span class="rem">-' + c.removed + '</span>' : '') + '</td>';
        }).join('');
        var endEff = Math.min(w.end, t);
        var st = C.seriesSum(ctx.streams, w.start, endEff);
        var pv = C.seriesSum(ctx.streams, w.start - 7 * C.DAY, w.end - 7 * C.DAY);
        var pc = st && pv && !w.partial ? C.pctChange(st.sum, pv.sum) : null;
        return '<tr' + (w.partial ? ' class="live"' : '') + '><td><span class="strong">Week ' + w.n + '</span> <span class="muted">' + C.fmtShort(w.start) + ' to ' + C.fmtShort(w.end) + (w.partial ? ', so far' : '') + '</span></td>' + cells +
          '<td class="num strong">' + w.totalActive + (w.totalAdded ? '<span class="add">+' + w.totalAdded + '</span>' : '') + '</td>' +
          '<td class="num">' + (st ? C.fmtNum(st.sum) + (pc != null ? '<span class="' + (pc >= 0 ? 'add' : 'rem') + '">' + (pc >= 0 ? '+' : '') + pc + '%</span>' : '') : '<span class="dim">-</span>') + '</td></tr>';
      }).join('');
      table = '<div class="table-wrap"><table>' + head + rows + '</table></div>';
    }
    var moves = C.chartMoves(ctx.charts).sort(function (a, b) { return a.position - b.position; }).slice(0, 12);
    var charts = moves.length ? '<div class="section"><h2>Chart positions right now</h2><div class="chips">' + moves.map(function (m) {
      var tag = m.isNew ? '<span class="u">new</span>' : (m.delta > 0 ? '<span class="u">up ' + m.delta + '</span>' : (m.delta < 0 ? '<span class="d">down ' + (-m.delta) + '</span>' : '<span class="d">steady</span>'));
      return '<span class="chip">' + esc(m.label) + ' <b>#' + m.position + '</b> ' + tag + '</span>';
    }).join('') + '</div></div>' : '';
    return '<div class="section"><h2>Editorial playlists by release week</h2>' + table +
      '<p class="muted" style="font-size:14px;margin:12px 0 0">Each number is how many editorial playlists held the record at the end of that week. A green plus is added during the week and a red minus is removed. Weeks run Friday to Thursday from release day. Spotify stream days are shifted to match Spotify for Artists.</p></div>' + charts;
  }

  function tabPlaylists(ctx) {
    var ed = C.editorialOnly(ctx.placements);
    var indep = ctx.placements.filter(function (p) { return p.kind === 'independent'; }).length;
    var html = '';
    if (!ed.length) html += '<div class="empty" style="padding:32px"><p style="margin:0">No editorial playlists recorded yet.' + (indep ? ' ' + plural(indep, 'independent playlist') + ' found, which this tool leaves out.' : '') + '</p></div>';
    C.DSPS.forEach(function (d) {
      var mine = ed.filter(function (p) { return p.dsp === d.key; });
      if (!mine.length) return;
      mine.sort(function (a, b) { return Number(C.activeNow(b)) - Number(C.activeNow(a)) || (b.followers || 0) - (a.followers || 0); });
      html += '<div class="group-title">' + d.label + '</div>';
      mine.forEach(function (p) {
        var first = p.spans.map(function (s) { return s.added_at; }).filter(Boolean).sort()[0];
        var gone = !C.activeNow(p);
        var removed = p.spans.map(function (s) { return s.removed_at; }).filter(Boolean).sort().slice(-1)[0];
        var rg = C.activeRegions(p).join(', ');
        var pos = p.spans.map(function (s) { return s.position; }).filter(function (x) { return x != null; });
        var bits = [first ? 'Added ' + C.fmtShort(C.parseDate(first)) : '', gone && removed ? 'removed ' + C.fmtShort(C.parseDate(removed)) : '', rg ? 'in ' + rg : '', pos.length ? 'position ' + Math.min.apply(null, pos) : '', p.followers ? C.fmtNum(p.followers) + ' followers' : ''].filter(Boolean);
        var line = bits.join(', '); line = line.charAt(0).toUpperCase() + line.slice(1);
        html += '<div class="pl">' + (p.artwork ? '<img src="' + esc(p.artwork) + '" alt="" loading="lazy">' : '<div class="ph"></div>') +
          '<div class="n"><div>' + esc(p.name || '(unnamed)') + '</div><div class="muted" style="font-size:14px">' + esc(line) + '</div></div>' +
          '<span class="pill ' + (gone ? 'bad' : 'good') + '">' + (gone ? 'Removed' : 'Live') + '</span>' +
          (p.manual ? '<button class="btn quiet small" data-act="delManual" data-idx="' + p.manualIndex + '">Delete</button>' : '') + '</div>';
      });
    });
    if (indep && ed.length) html += '<p class="muted" style="font-size:14px;margin-top:16px">' + plural(indep, 'independent playlist') + ' not shown, because this tool is for editorial.</p>';
    var form = state.ui.logOpen ?
      '<div class="section" style="margin-top:32px"><h2>Log a placement by hand</h2><p class="muted" style="margin-top:0">For Amazon Music, YouTube Music, Beatport, SoundCloud, or anything the refresh missed.</p>' +
      '<div class="grid2"><div class="field"><label for="m_dsp">Where</label><select id="m_dsp">' + C.DSPS.map(function (d) { return '<option value="' + d.key + '"' + (d.auto ? '' : ' selected') + '>' + d.label + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="m_name">Playlist name</label><input id="m_name" placeholder="e.g. Dance Heat"></div>' +
      '<div class="field"><label for="m_reg">Country (optional)</label><input id="m_reg" placeholder="UK"></div>' +
      '<div class="field"><label for="m_add">Date added</label><input id="m_add" type="date" value="' + C.iso(today()) + '"></div></div>' +
      '<div style="display:flex;gap:10px"><button class="btn primary" data-act="addManual">Save placement</button><button class="btn quiet" data-act="toggleLog">Cancel</button></div></div>' :
      '<div style="margin-top:28px"><button class="btn" data-act="toggleLog">Log a placement by hand</button></div>';
    return '<div class="section">' + html + form + '</div>';
  }

  // ---- follow-ups

  // ---- sort playlists
  function viewSort(list) {

      return '<div class="task sort-row">' + (p.artwork ? '<img class="art" src="' + esc(p.artwork) + '" alt="" loading="lazy">' : '<div class="art"></div>') +

  // ---- dialogs
  function openModal(which) { state.ui.modal = which; renderModal(); var f = $('#modal input'); if (f) f.focus(); }

  function renderModal() {

        '<div class="field"><label for="a_link">Track link or ISRC</label><input id="a_link" placeholder="https://open.spotify.com/track/..." autocomplete="off"></div>' +

        '<div class="actions"><button class="btn quiet" data-act="closeModal">Cancel</button><button class="btn primary" data-act="addRecord">Add record</button></div></div>';

        '<details class="more"><summary>Branch</summary><div class="field"><input id="s_branch" value="' + esc(c.branch) + '"></div></details>' +
        '<div class="actions"><button class="btn quiet" data-act="closeModal">Cancel</button><button class="btn primary" data-act="saveSettings">Save settings</button></div></div>';
    }
  }

  // ------------------------------------------------------------ actions
  async function triggerSync(only) {
    if (needToken()) return false;
    var c = cfg(), before = state.history.generated_at;
    state.syncing = true; render();
    try {
      var r = await ghFetch('/actions/workflows/sync.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: c.branch, inputs: { isrc: only || '' } }) });
      if (!r.ok) throw new Error('The refresh could not start (' + r.status + '). Check the token allows Actions read and write.');
      toast('Refresh started. It takes a minute or two.');
      for (var i = 0; i < 30; i++) {
        await new Promise(function (res) { setTimeout(res, 8000); });
        var raw = await ghFetch('/contents/data/history.json?ref=' + encodeURIComponent(c.branch), { headers: { 'Accept': 'application/vnd.github.raw+json' } });
        if (!raw.ok) continue;
        var h = JSON.parse(await raw.text());
        if (h.generated_at && h.generated_at !== before) {
          state.history = h;
          var rr = await ghFetch('/contents/data/resolved.json?ref=' + encodeURIComponent(c.branch), { headers: { 'Accept': 'application/vnd.github.raw+json' } });
          if (rr.ok) state.resolved = JSON.parse(await rr.text());
          state.syncing = false; render(); toast('Data refreshed'); return true;
        }
      }
      toast('Still running. Reload the page in a minute.', true);
    } catch (e) { toast(e.message, true); }
    state.syncing = false; render();
    return false;
  }

  var actions = {
    startSelect: function () { state.ui.selecting = true; state.ui.sel = []; render(); },
    cancelSelect: function () { state.ui.selecting = false; state.ui.sel = []; render(); },
    toggleSel: function (el) {
      var id = el.dataset.isrc, i = state.ui.sel.indexOf(id);
      if (i >= 0) state.ui.sel.splice(i, 1);
      else if (state.ui.sel.length >= 4) { toast('Four records is plenty for one email.', true); return; }
      else state.ui.sel.push(id);
      render();
    },
    openBundle: function () {
      var ctxs = contexts();
      var count = function (c) { return C.editorialOnly(c.placements).filter(C.activeNow).length; };
      state.ui.sel = bundleCtxs(ctxs).sort(function (a, b) { return count(b) - count(a) || (b.release || 0) - (a.release || 0); }).map(function (c) { return c.isrc; });
      state.ui.selecting = false; go('bundle');
    },
    moveSel: function (el) {
      var a = state.ui.sel, i = a.indexOf(el.dataset.isrc), j = i + parseInt(el.dataset.dir, 10);
      if (i < 0 || j < 0 || j >= a.length) return;
      var t = a[i]; a[i] = a[j]; a[j] = t; render();
    },
    dropSel: function (el) { state.ui.sel = state.ui.sel.filter(function (x) { return x !== el.dataset.isrc; }); render(); },
    bdsp: function (el) { state.ui.bundle.dsp = el.dataset.dsp; render(); },
    markAllPitched: async function () {
      if (needToken()) return;
      var ids = state.ui.sel.slice(), dsp = state.ui.bundle.dsp, d = C.iso(today());
      try {
        var next = await mutateFile('data/pitches.json', function (o) { o.pitches = o.pitches || {}; ids.forEach(function (id) { (o.pitches[id] = o.pitches[id] || {})[dsp] = d; }); });
        state.pitches = next; render(); toast('Logged as pitched to ' + C.DSP_LABEL[dsp]);
      } catch (e) { toast(e.message, true); }
    },
    openAdd: function () { openModal('add'); },
    openSettings: function () { openModal('settings'); },
    closeModal: function () { closeModal(); },
    saveSettings: function () {
      LS.set('epp_token', $('#s_token').value.trim()); LS.set('epp_owner', $('#s_owner').value.trim()); LS.set('epp_repo', $('#s_repo').value.trim()); LS.set('epp_branch', ($('#s_branch').value || '').trim() || 'main');
      closeModal(); render(); toast('Settings saved');
    },
    sync: function () { return triggerSync(''); },
    pdsp: function (el) { var ctx = ctxFor(state.ui.rec); if (!ctx) return; var s = pitchState(ctx); s.dsp = el.dataset.dsp; s.followUp = null; render(); },
    copySubj: function () { copy($('#p_subj').value); },
    copyBody: function () { copy($('#p_body').value); },
    toggleLog: function () { state.ui.logOpen = !state.ui.logOpen; render(); },
    writeFollowUp: function (el) { var ctx = ctxFor(el.dataset.isrc); if (ctx) { var s = pitchState(ctx); s.dsp = el.dataset.dsp; s.followUp = true; } go('record/' + encodeURIComponent(el.dataset.isrc) + '/pitch'); },
    markPitched: async function () {
      if (needToken()) return;
      var id = state.ui.rec, dsp = pitchState(ctxFor(id)).dsp, d = C.iso(today());
      try {
        var next = await mutateFile('data/pitches.json', function (o) { o.pitches = o.pitches || {}; (o.pitches[id] = o.pitches[id] || {})[dsp] = d; });
        state.pitches = next; render(); toast('Logged as pitched to ' + C.DSP_LABEL[dsp]);
      } catch (e) { toast(e.message, true); }
    },
    tag: async function (el) {
      if (needToken()) return;
      var key = el.dataset.key, kind = el.dataset.kind, name = el.dataset.name;
      try {
        var next = await mutateFile('data/registry.json', function (o) { o.playlists = o.playlists || {}; o.playlists[key] = { kind: kind, name: name }; });
        state.registry = next; render(); toast('Saved');
      } catch (e) { toast(e.message, true); }
    },
    tagAllIgnore: async function () {
      if (needToken()) return;
      var list = collectUntagged(contexts());
      if (!list.length || !confirm('Ignore all ' + list.length + ' remaining playlists? You can still tag any of them later by removing them from data/registry.json.')) return;
      try {
        var next = await mutateFile('data/registry.json', function (o) { o.playlists = o.playlists || {}; list.forEach(function (p) { o.playlists[p.key] = { kind: 'ignore', name: p.name || '' }; }); });
        state.registry = next; render(); toast('Done');
      } catch (e) { toast(e.message, true); }
    },
    addManual: async function () {
      if (needToken()) return;
      var id = state.ui.rec, name = $('#m_name').value.trim(), added = $('#m_add').value;
      if (!name) { toast('Add the playlist name first.', true); return; }
      var entry = { dsp: $('#m_dsp').value, playlist: name, region: $('#m_reg').value.trim(), added_at: added || C.iso(today()) };
      try {
        var next = await mutateFile('data/manual.json', function (o) { o.entries = o.entries || {}; (o.entries[id] = o.entries[id] || []).push(entry); });
        state.manual = next; state.ui.logOpen = false; render(); toast('Placement saved');
      } catch (e) { toast(e.message, true); }
    },
    delManual: async function (el) {
      if (needToken()) return;
      var id = state.ui.rec, idx = parseInt(el.dataset.idx, 10);
      if (!confirm('Delete this placement?')) return;
      try {
        var next = await mutateFile('data/manual.json', function (o) { if (o.entries && o.entries[id]) o.entries[id].splice(idx, 1); });
        state.manual = next; render(); toast('Deleted');
      } catch (e) { toast(e.message, true); }
    },
    saveDetails: async function () {
      if (needToken()) return;
      var id = state.ui.rec, g = function (n) { return ($('#d_' + n).value || '').trim(); };
      var rel = g('rel');
      if (rel && C.parseDate(rel) == null) { toast('Write the release date like 2026-10-02.', true); return; }
      try {
        var next = await mutateFile('data/tracked.json', function (o) {
          var t = (o.tracks || []).filter(function (x) { return entryIsrc(x) === id; })[0]; if (!t) return;
          t.hook = g('hook'); t.artist = g('artist'); t.track = g('track'); if (rel) t.release_date = rel; else delete t.release_date;
          t.links = { amazon: g('amazon'), youtube: g('youtube'), beatport: g('beatport'), soundcloud: g('soundcloud') };
        });
        state.tracked = next; render(); toast('Changes saved');
      } catch (e) { toast(e.message, true); }
    },
    removeRecord: async function () {
      if (needToken()) return;
      var id = state.ui.rec;
      if (!confirm('Remove this record? Its stored history is cleared at the next refresh.')) return;
      try {
        var next = await mutateFile('data/tracked.json', function (o) { o.tracks = (o.tracks || []).filter(function (x) { return entryIsrc(x) !== id; }); });
        state.tracked = next; toast('Record removed'); go('records');
      } catch (e) { toast(e.message, true); }
    },
    removePending: async function (el) {
      if (needToken()) return;
      var key = el.dataset.key;
      try {
        var next = await mutateFile('data/tracked.json', function (o) { o.tracks = (o.tracks || []).filter(function (x) { return (x.key || x.link) !== key; }); });
        state.tracked = next; render(); toast('Removed');
      } catch (e) { toast(e.message, true); }
    },
    addRecord: async function () {
      if (needToken()) return;
      var typed = ($('#a_link').value || '').trim();
      var parsed = C.normalizeLink(typed);
      if (parsed.error) { toast(parsed.error, true); return; }
      var entry = { artist: ($('#a_artist').value || '').trim(), track: ($('#a_track').value || '').trim(), hook: ($('#a_hook').value || '').trim(), links: {}, added: C.iso(today()) };
      var only = parsed.value;
      if (parsed.type === 'isrc') entry.isrc = parsed.value; else { entry.key = parsed.value; entry.link = typed; }
      var already = function (t) {
        return (entry.isrc && entryIsrc(t) === entry.isrc) || (entry.key && ((t.key || t.link) === entry.key || (resolvedFor({ key: entry.key }).isrc && entryIsrc(t) === resolvedFor({ key: entry.key }).isrc)));
      };
      if ((state.tracked.tracks || []).some(already)) { toast('That record is already in your list.', true); return; }
      try {
        var next = await mutateFile('data/tracked.json', function (o) { o.tracks = o.tracks || []; if (!o.tracks.some(already)) o.tracks.push(entry); });
        state.tracked = next; state.ui.modal = null;
        if (entry.isrc) go('record/' + encodeURIComponent(entry.isrc)); else go('records');
        triggerSync(only);
      } catch (e) { toast(e.message, true); }
    }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) { if (ev.target.id === 'modal') closeModal(); return; }
    if (ev.target.closest('select,input,textarea')) return;
    var fn = actions[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el); }
  });
  function pitchInput(ev) {
    if (!ev.target.id || ['p_week', 'p_name', 'p_fu'].indexOf(ev.target.id) < 0) return;
    if (state.ui.view === 'bundle') { updateBundle(contexts()); return; }
    var ctx = ctxFor(state.ui.rec); if (ctx) updatePitch(ctx);
  }
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'h_week') { state.ui.hl[state.ui.rec] = parseInt(ev.target.value, 10); render(); }
  });
  document.addEventListener('input', pitchInput);
  document.addEventListener('change', pitchInput);
  document.addEventListener('keydown', function (ev) {
    if ((ev.key === ' ' || ev.key === 'Enter') && ev.target && ev.target.classList && ev.target.classList.contains('pick')) { ev.preventDefault(); actions.toggleSel(ev.target); return; }
    if (ev.key === 'Escape' && state.ui.modal) closeModal();
    if (ev.key === 'Enter' && state.ui.modal === 'add' && ev.target && ev.target.id === 'a_link') { ev.preventDefault(); actions.addRecord(); }
  });

  window.__epp = { state: state, render: render, actions: actions, loadAll: loadAll, go: go };
  readHash();
  loadAll();
})();
</script>
