<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Pitch Pack</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%2335d975%27/%3E%3Cg%20fill=%27%2305160c%27%3E%3Crect%20x=%276%27%20y=%278.3%27%20width=%2710%27%20height=%273.4%27%20rx=%271.7%27/%3E%3Crect%20x=%276%27%20y=%2714.3%27%20width=%2720%27%20height=%273.4%27%20rx=%271.7%27/%3E%3Crect%20x=%276%27%20y=%2720.3%27%20width=%2720%27%20height=%273.4%27%20rx=%271.7%27/%3E%3Cpolygon%20points=%2723.5%2C4.8%2024.9%2C8.1%2028.4%2C8.4%2025.7%2C10.7%2026.6%2C14.2%2023.5%2C12.3%2020.4%2C14.2%2021.3%2C10.7%2018.6%2C8.4%2022.1%2C8.1%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0c1210; --panel:#141c18; --raised:#1b2621; --line:#2a3830;
  --text:#e9f0eb; --muted:#9fb2a6; --signal:#35d975; --signal-ink:#05160c;
  --amber:#f0b44a; --red:#ff8a8a;
  --font:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 15px/1.5 var(--font)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.strong{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* top bar and navigation */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.1px}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);margin-right:6px}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 28px;overflow-x:auto}
.nav a,.tabs a{padding:12px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.nav a:hover,.tabs a:hover{color:var(--text)}
.nav a.on,.tabs a.on{color:var(--text);border-bottom-color:var(--signal)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--amber);color:#1c1200;font-size:12px;font-weight:700;text-align:center}
.count.signal{background:var(--signal);color:var(--signal-ink)}

/* buttons and form controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3d5246}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);background:var(--raised)}
.btn.danger{background:transparent;border-color:#5b3030;color:var(--red)}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=password],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
input::placeholder,textarea::placeholder{color:#62756a}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text);margin:0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--signal)}

/* page heads */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.lede{color:var(--muted);margin:0;max-width:60ch}

/* record list */
.list{border-top:1px solid var(--line)}
.row{display:flex;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line)}
a.row:hover{background:var(--panel)}
.art{width:52px;height:52px;border-radius:8px;background:var(--raised);object-fit:cover;flex:none}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{color:var(--muted);font-size:14px}
.strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
.pill{display:inline-flex;gap:5px;align-items:center;padding:2px 10px;border-radius:999px;background:var(--raised);font-size:13px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}
.pill.good{background:rgba(53,217,117,.14);color:var(--signal)}
.pill.wait{background:rgba(240,180,74,.14);color:var(--amber)}
.pill.bad{background:rgba(255,138,138,.14);color:var(--red)}
.chev{flex:none;color:var(--muted)}

/* callouts and empty states */
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:rgba(240,180,74,.1);color:#f6d79a;margin-bottom:20px;font-size:14px}
.callout.error{background:rgba(255,138,138,.1);color:#ffc0c0}
.empty{padding:56px 24px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.empty h2{font-size:20px;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:52ch}

/* record page */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);margin-bottom:16px;font-size:14px;padding:4px 0}
.back:hover{color:var(--text)}
.rec-head{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.rec-head .art{width:84px;height:84px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.tile{background:var(--panel);border-radius:12px;padding:14px 16px}
.tile .v{font-size:24px;font-weight:700;line-height:1.2}
.tile .l{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.section{margin-bottom:32px}

/* pitch builder */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;padding:4px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500;line-height:1.25}
.seg-btn small{font-size:11px;color:var(--muted);font-weight:400}
.seg-btn:hover{border-color:#3d5246}
.seg-btn[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:700}
.seg-btn[aria-pressed=true] small{color:#0b3a1d}
.step-title{display:flex;gap:10px;align-items:baseline;margin:0 0 10px;font-size:17px;font-weight:600}
.step-title .n{color:var(--signal);font-weight:700}
.paper{background:#f3f6f3;color:#0f1612;border-radius:12px;padding:20px 22px}
.paper label{color:#5a6a60}
.paper input,.paper textarea{background:transparent;border:0;border-bottom:1px solid #cfd8d1;border-radius:0;padding:6px 0;color:#0f1612;min-height:0}
.paper input:focus,.paper textarea:focus{outline:none;border-bottom-color:#1f9d55}
.paper textarea{border:0;line-height:1.6;resize:vertical;min-height:300px;font-size:15px;padding:8px 0}
.paper .subj{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.paper .subj>div{flex:1}
details.more{margin:8px 0 16px;color:var(--muted)}
details.more summary{cursor:pointer;padding:6px 0;font-size:14px}
details.more[open] summary{margin-bottom:10px}

/* tables and lists */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:13px}
tr.live td{background:rgba(53,217,117,.05)}
.add{color:var(--signal);font-size:12px;margin-left:4px}
.rem{color:var(--red);font-size:12px;margin-left:4px}
.dim{color:#4a5c51}
.pl{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl img,.pl .ph{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--raised);flex:none}
.pl .n{flex:1;min-width:0}
.pl .n div:first-child{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-title{margin:24px 0 4px;font-weight:600;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:8px;background:var(--panel);font-size:14px}
.chip .u{color:var(--signal)}
.chip .d{color:var(--muted)}

/* follow-ups and sorting */
.task{display:flex;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line)}
.task .main{flex:1;min-width:0}
.sort-row .btns{display:flex;gap:8px;flex:none}

/* highlights */
.hl-pick{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin:-8px 0 16px}
.hl-pick label{margin:0}
.hl-pick select{width:auto;min-width:240px}
.pick-group{margin:0 0 16px}.pick-group h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}.pick-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line,#2a332d)}.pick-row label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:1.4}.pick-row input{margin-top:3px}.lead-list{margin:0;padding-left:20px;font-size:16px;line-height:1.6}.hero{background:var(--panel);border-left:4px solid var(--signal);border-radius:0 12px 12px 0;padding:20px 24px;margin-bottom:32px}
.hero h2{margin:0 0 6px;color:var(--muted);font-size:14px;font-weight:500}
.hero-text{font-size:24px;line-height:1.3;font-weight:700;margin:0;max-width:34ch}
.hero-more{margin:12px 0 0;font-size:14px}
.tiles4{grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding:0}
.bar{flex:1;background:#33443a;border-radius:2px 2px 0 0;min-height:3px}
.bar.on{background:var(--signal)}
.dsp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dsp-card{background:var(--panel);border-radius:12px;padding:16px 18px}
.dsp-card h3{margin:0 0 8px;font-size:16px;font-weight:600}
.dsp-main{font-size:15px}
.dsp-card .chip{background:var(--raised)}
.dsp-chart{margin-top:10px;font-size:14px;color:var(--text)}
/* monitor */
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.ov{background:var(--panel);border-radius:12px;padding:14px 16px;border-left:4px solid var(--line);display:flex;flex-direction:column}
.ov b{font-size:26px;line-height:1.2}
.ov span{color:var(--muted);font-size:13px}
.ov.acc{border-left-color:var(--signal)}.ov.pla{border-left-color:var(--amber)}.ov.dec{border-left-color:var(--red)}.ov.good{border-left-color:#7ab8ff}
.trend{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.trend.big{font-size:15px;padding:5px 14px 5px 10px}
.trend.acc{background:rgba(53,217,117,.15);color:var(--signal)}
.trend.pla{background:rgba(240,180,74,.15);color:var(--amber)}
.trend.dec{background:rgba(255,138,138,.15);color:var(--red)}
.trend.early{background:var(--raised);color:var(--muted)}
.mhead,.mrow{display:grid;grid-template-columns:minmax(220px,2.2fr) 150px 112px 92px 112px minmax(0,1.1fr) 16px;gap:14px;align-items:center}
.mhead{padding:8px 8px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.mrow{padding:14px 8px;border-bottom:1px solid var(--line)}
a.mrow:hover{background:var(--panel)}
.m-title{display:flex;gap:12px;align-items:center;min-width:0}
.m-title .row-title{white-space:normal}
.m-trend{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.art.sm{width:40px;height:40px;border-radius:6px}
.m-spark.acc{color:var(--signal)}.m-spark.pla{color:var(--amber)}.m-spark.dec{color:var(--red)}.m-spark.early{color:var(--muted)}
.m-num{font-size:15px}
.m-chart{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row.feed{padding:12px 8px;gap:12px}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.traj-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.traj-text{margin:0 0 10px;max-width:70ch}
.traj-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.trend-chart{width:100%;height:auto;display:block;background:var(--panel);border-radius:12px}
.trend-chart .area{fill:rgba(53,217,117,.12)}
.trend-chart .ln{fill:none;stroke:var(--signal);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.trend-chart .band.now{fill:rgba(255,255,255,.06)}
.trend-chart .band.prev{fill:rgba(255,255,255,.025)}
.trend-chart .tl{fill:var(--muted);font-size:11px;font-family:inherit}
.trend-chart .mk line{stroke-width:1;stroke-dasharray:3 3}
.trend-chart .mk.add line{stroke:rgba(53,217,117,.55)}.trend-chart .mk.add circle{fill:var(--signal)}
.trend-chart .mk.rem line{stroke:rgba(255,138,138,.55)}.trend-chart .mk.rem circle{fill:var(--red)}
.key{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.key.add{background:var(--signal)}.key.rem{background:var(--red)}
/* picking several records */
.row.pick{cursor:pointer}
.row.pick:hover{background:var(--panel)}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--signal-ink);font-weight:700;font-size:14px}
.box.on{background:var(--signal);border-color:var(--signal)}
.selbar{position:sticky;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:12px 16px;background:var(--raised);border:1px solid var(--line);border-radius:12px}
/* dialogs */
#modal{position:fixed;inset:0;background:rgba(5,9,7,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:30;overflow-y:auto}
#modal.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:24px}
.dialog h2{font-size:20px;margin-bottom:6px}
.dialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;max-width:90vw}
#toast.show{opacity:1}
#toast.err{border-color:#7a2d2d;color:#ffc0c0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:720px){
  .wrap{padding:0 14px}
  .strip{display:none}
  .overview{grid-template-columns:1fr 1fr}
  .mhead{display:none}
  .mrow{grid-template-columns:1fr 100px;gap:8px 12px;padding:14px 4px}
  .m-title{grid-column:1 / -1}
  .m-trend{grid-column:1}
  .m-spark{grid-column:2;grid-row:2;justify-self:end}
  .m-num,.m-chart{grid-column:1 / -1;font-size:14px}
  .m-num::before,.m-chart::before{content:attr(data-l) ': ';color:var(--muted)}
  .mrow .chev{display:none}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
  .tiles4{grid-template-columns:1fr 1fr}
  .dsp-grid{grid-template-columns:1fr}
  .hero-text{font-size:20px}
  .hl-pick{justify-content:flex-start}
  .hl-pick select{min-width:0;width:100%}
  .tile{padding:12px}
  .tile .v{font-size:19px}
  .tile .l{font-size:12px}
  .sort-row .main{flex:1 1 calc(100% - 80px)}
  .sort-row .btns{flex:1 1 100%;flex-wrap:wrap}
  .grid2,.grid4{grid-template-columns:1fr}
  .rec-head .art{width:64px;height:64px}
  h1{font-size:22px}
  .task,.sort-row{flex-wrap:wrap}
  .status{display:none}
  .paper{padding:16px}
}
/* records: table + full sheets */
body.wide .wrap{max-width:1320px}
.rt{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:28px;overflow:hidden}
.rt-top{padding:12px 18px 6px}
.rt-row{display:grid;grid-template-columns:40px minmax(220px,2.4fr) 150px repeat(6,minmax(78px,1fr)) 34px;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.rt-row.rt-h{border-top:0;padding-top:4px;padding-bottom:6px}
.th{background:none;border:0;padding:0;text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.th.on,.th:hover{color:var(--text)}
.rt-row.rec{cursor:pointer}
.rt-row.rec:hover{background:var(--raised)}
.rt-name{min-width:0}
.rt-name .row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-name .row-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-name .topline{color:var(--signal)}
.rt-c{display:flex;flex-direction:column;line-height:1.25}
.rt-c b{font-size:15px}
.d0,.du,.dd,.dn{font-size:12px;font-weight:600}
.d0{color:#6f8478;font-weight:500}.du{color:var(--signal)}.dd{color:var(--red)}.dn{color:#8fb7ff}
.newtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--signal);color:var(--signal-ink);border-radius:4px;padding:0 5px;margin-top:2px;width:max-content}
.pickbox{margin:0;display:flex;justify-content:center;cursor:pointer}
.pickbox input,.check.small input{width:17px;height:17px;accent-color:var(--signal)}
.art.sm{width:40px;height:40px;border-radius:7px;object-fit:cover;background:var(--raised)}
.sheets{display:flex;flex-direction:column;gap:22px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;scroll-margin-top:12px;transition:box-shadow .3s}
.sheet.flash{box-shadow:0 0 0 2px var(--signal)}
.sh-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.sh-head .art{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--raised);flex-shrink:0}
.sh-t{flex:1;min-width:0}
.sh-t h2{margin:0 0 2px;font-size:19px}
.sh-t .muted{font-size:13px}
.lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;vertical-align:3px;margin-left:6px}
.lks{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.lk{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.lk:hover{color:var(--text);border-color:var(--signal)}
.sh-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.check.small{font-size:13px;color:var(--muted)}
.mstrip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
@media (max-width:1200px){.mstrip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.mc{background:var(--raised);padding:9px 11px;min-width:0}
.mc.none{opacity:.55}
.mc-l{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-v{font-size:18px;font-weight:700;margin:1px 0}
.mc-f{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mc-f .tot{font-size:11px;color:#6f8478;white-space:nowrap}
.sh-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
@media (max-width:1100px){.sh-grid{grid-template-columns:1fr}}
.pbox{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.pbox h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.box-h .muted{font-size:12.5px}
.hint{font-size:12.5px;margin:0 0 4px}
.ticks{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.ng{margin-bottom:8px}
.ng-t{font-size:12px;font-weight:700;color:var(--text);margin:6px 0 2px}
.ni{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text);margin:0;padding:3px 0;line-height:1.4;cursor:pointer}
.ni input{margin-top:3px;accent-color:var(--signal);flex-shrink:0}
.ni.fresh span{font-weight:700}
.ni.fresh span::before{content:"NEW";font-size:9.5px;font-weight:800;background:var(--signal);color:var(--signal-ink);border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:2px}
.chartbox .trend-chart{width:100%;height:auto}
.edcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1200px){.edcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.edc-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:3px}
.li{padding:4px 0;min-width:0}
.li-n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:11.5px;color:#7d9286;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more-btn{background:none;border:0;color:var(--signal);font-size:12.5px;padding:4px 0 0;cursor:pointer}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--raised);border:1px solid var(--signal);border-radius:12px;padding:8px 10px 8px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:30}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/records">Editorial Pitch Pack</a>
    <div class="top-right">
      <span class="status" id="synced"></span>
      <button class="btn quiet small" data-act="sync" id="syncBtn">Refresh data</button>
      <button class="btn quiet small" data-act="openSettings">Settings</button>
    </div>
  </div>
</header>
<main class="wrap" style="padding-top:8px;padding-bottom:96px">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div id="banner"></div>
  <div id="view"></div>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Core;
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG') t.style.visibility = 'hidden'; }, true);
  var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var BACK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var state = {
    tracked: { tracks: [] }, history: { generated_at: null, records: {} },
    registry: { playlists: {} }, manual: { entries: {} }, pitches: { pitches: {} }, resolved: { entries: {} },
    ui: { view: 'records', rec: null, tab: 'playlists', hl: {}, pitch: {}, modal: null, logOpen: false, selecting: false, sel: [], sort: 'newest', period: 'latest', tick: {}, open: {}, bundle: { dsp: 'spotify', name: '', followUp: false } },
    loadError: null, syncing: false
  };

  // ------------------------------------------------------------ routing (so Back and bookmarks work)
  function readHash() {
    var p = location.hash.replace(/^#\/?/, '').split('/');
    if (p[0] === 'record' && p[1]) { state.ui.view = 'record'; state.ui.rec = decodeURIComponent(p[1]); state.ui.tab = ['progress', 'playlists', 'details'].indexOf(p[2]) >= 0 ? p[2] : 'playlists'; }
    else if (p[0] === 'sort') state.ui.view = 'sort';
    else state.ui.view = 'records';
  }
  function go(path) { var h = '#/' + path; if (location.hash === h) { render(); } else { location.hash = h; } }
  window.addEventListener('hashchange', function () { readHash(); state.ui.logOpen = false; render(); window.scrollTo(0, 0); });

  // ------------------------------------------------------------ settings and GitHub
  var LS = { get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  function detectRepo() {
    var host = location.hostname, parts = location.pathname.split('/').filter(Boolean);
    if (/\.github\.io$/.test(host)) return { owner: host.split('.')[0], repo: parts[0] || '' };
    return { owner: '', repo: '' };
  }
  function cfg() {
    var d = detectRepo();
    return { token: LS.get('epp_token'), owner: LS.get('epp_owner') || d.owner, repo: LS.get('epp_repo') || d.repo, branch: LS.get('epp_branch') || 'main' };
  }
  function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function ghFetch(path, opts) {
    var c = cfg();
    opts = opts || {};
    opts.cache = 'no-store';   // never let the browser hand back an old copy of a file (it caused tags to be saved onto stale data)
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, opts.headers || {});
    return fetch('https://api.github.com/repos/' + c.owner + '/' + c.repo + path, opts);
  }
  function needToken() {
    var c = cfg();
    if (!c.token || !c.owner || !c.repo) { toast('Connect GitHub first. Open Settings and paste your token.', true); openModal('settings'); return true; }
    return false;
  }
  // Read-modify-write one JSON file in the repo, retrying if something else changed it meanwhile.
  // One request gives both the content and its version (sha), so they always belong together.
  var FILE_KEY = { 'data/registry.json': 'playlists', 'data/pitches.json': 'pitches', 'data/manual.json': 'entries', 'data/tracked.json': 'tracks' };
  function b64ToUtf8(b) { return decodeURIComponent(escape(atob(String(b).replace(/\s/g, '')))); }
  async function mutateFile(path, mutator) {
    var c = cfg(), key = FILE_KEY[path];
    for (var attempt = 0; attempt < 4; attempt++) {
      var meta = await ghFetch('/contents/' + path + '?ref=' + encodeURIComponent(c.branch));
      if (!meta.ok) throw new Error('Could not read ' + path + ' (' + meta.status + ')');
      var info = await meta.json();
      var obj = JSON.parse(b64ToUtf8(info.content));
      if (key && obj[key] == null) {
        if (key === 'tracks') throw new Error(path + ' does not look right, so nothing was saved. Check it in GitHub.');
        obj = {}; obj[key] = key === 'playlists' || key === 'pitches' || key === 'entries' ? {} : [];
      }
      var next = mutator(obj) || obj;
      if (key) { var clean = {}; clean[key] = next[key]; next = clean; }   // drop any stray keys
      var put = await ghFetch('/contents/' + path, { method: 'PUT', body: JSON.stringify({ message: 'Update ' + path + ' from page', content: utf8ToB64(JSON.stringify(next, null, 1) + '\n'), sha: info.sha, branch: c.branch }) });
      if (put.ok) return next;
      if (put.status !== 409 && put.status !== 422) throw new Error('Save failed (' + put.status + ')');
    }
    throw new Error('Save kept conflicting. Try again in a moment.');
  }

  // ------------------------------------------------------------ loading
  function getJSON(path) {
    return fetch(path + '?t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); });
  }
  // With a token set, read straight from the repo so a change you just made shows at once.
  // GitHub Pages can take a minute or two to catch up, which made saved changes look lost.
  async function readData(path) {
    var c = cfg();
    if (c.token && c.owner && c.repo) {
      try {
        var r = await ghFetch('/contents/' + path + '?ref=' + encodeURIComponent(c.branch), { headers: { 'Accept': 'application/vnd.github.raw+json' } });
        if (r.ok) return JSON.parse(await r.text());
      } catch (e) { /* fall back to the published copy */ }
    }
    return getJSON(path);
  }
  async function loadAll() {
    try {
      var r = await Promise.all(['tracked', 'history', 'registry', 'manual', 'pitches'].map(function (n) { return readData('data/' + n + '.json'); }));
      state.tracked = r[0]; state.history = r[1]; state.registry = r[2]; state.manual = r[3]; state.pitches = r[4];
      state.resolved = await readData('data/resolved.json').catch(function () { return { entries: {} }; });
      state.loadError = null;
    } catch (e) {
      state.loadError = 'The data files could not be loaded (' + e.message + '). Open this from your GitHub Pages address rather than from a file on your computer.';
    }
    render();
  }

  // ------------------------------------------------------------ data helpers
  function today() { return C.todayUTC(); }
  // Records added by link have no ISRC until the sync matches them (data/resolved.json).
  function resolvedFor(e) { return ((state.resolved.entries || {})[e.key || e.link || ''] || {}); }
  function entryIsrc(e) { return e.isrc || resolvedFor(e).isrc || ''; }
  function allItems() {
    var t = today(), seen = {}, out = [];
    (state.tracked.tracks || []).forEach(function (e) {
      var isrc = entryIsrc(e);
      if (!isrc) { out.push({ pending: true, key: e.key || e.link, link: e.link || e.key, error: resolvedFor(e).error || null, release: 9e15 }); return; }
      if (seen[isrc]) return;
      seen[isrc] = 1;
      var entry = Object.assign({}, e, { isrc: isrc });
      out.push(C.buildContext(entry, state.history.records[isrc], (state.manual.entries || {})[isrc] || [], state.registry.playlists || {}, t));
    });
    return out.sort(function (a, b) { return (b.release || 0) - (a.release || 0); });
  }
  function contexts() { return allItems().filter(function (i) { return !i.pending; }); }
  function ctxFor(isrc) { return contexts().filter(function (c) { return c.isrc === isrc; })[0]; }
  function pitchState(ctx) {
    var s = state.ui.pitch[ctx.isrc];
    if (!s) s = state.ui.pitch[ctx.isrc] = { dsp: 'spotify', week: null, followUp: null, name: '', playlist: '' };
    return s;
  }
  function lastPitched(isrc, dsp) { return ((state.pitches.pitches || {})[isrc] || {})[dsp] || null; }
  function title(ctx) { return (ctx.artist || '(waiting for first refresh)') + (ctx.track ? ' - ' + ctx.track : ''); }
  function collectUntagged(ctxs) {
    var seen = {}, out = [], order = C.DSPS.map(function (d) { return d.key; });
    ctxs.forEach(function (ctx) {
      C.needsTagging(ctx.placements).forEach(function (p) {
        var k = p.dsp + ':' + p.id;
        if (!seen[k]) { seen[k] = { key: k, dsp: p.dsp, id: p.id, name: p.name, artwork: p.artwork, followers: p.followers, regions: {}, records: [] }; out.push(seen[k]); }
        seen[k].records.push(ctx.track || ctx.isrc);
        (p.spans || []).forEach(function (s) { if (s.cc) seen[k].regions[s.cc] = 1; });
      });
    });
    out.sort(function (a, b) { return order.indexOf(a.dsp) - order.indexOf(b.dsp) || (b.followers || 0) - (a.followers || 0) || String(a.name).localeCompare(String(b.name)); });
    return out;
  }
  function followUpItems(ctxs) {
    var out = [];
    ctxs.forEach(function (ctx) {
      C.followUps(ctx, (state.pitches.pitches || {})[ctx.isrc] || {}).forEach(function (f) { if (!f.never && f.count > 0) out.push({ ctx: ctx, f: f }); });
    });
    return out;
  }
  function toast(msg, err) {
    var el = $('#toast'); el.textContent = msg; el.className = 'show' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = ''; }, err ? 6000 : 2600);
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    return fallback();
    function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed. Select the text and copy it by hand.', true); } ta.remove(); }
  }
  function ago(iso) {
    if (!iso) return 'never';
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 2) return 'just now'; if (m < 90) return m + ' minutes ago';
    var h = Math.round(m / 60); if (h < 36) return h + ' hours ago';
    return Math.round(h / 24) + ' days ago';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }

  // ------------------------------------------------------------ render
  function render() {
    var items = allItems(), ctxs = items.filter(function (i) { return !i.pending; });
    var untagged = collectUntagged(ctxs);
    $('#synced').textContent = state.history.generated_at ? 'Updated ' + ago(state.history.generated_at) : 'Not refreshed yet';
    var sb = $('#syncBtn'); sb.disabled = state.syncing; sb.textContent = state.syncing ? 'Refreshing...' : 'Refresh data';
    $('#banner').innerHTML = state.loadError ? '<div class="callout error"><span>' + esc(state.loadError) + '</span></div>' : '';

    var view = state.ui.view;
    var navView = (view === 'record' || view === 'bundle') ? 'records' : view;
    var nav = [['records', 'Records', 0], ['sort', 'Sort playlists', untagged.length]];
    $('#nav').innerHTML = nav.map(function (n) {
      return '<a href="#/' + n[0] + '" class="' + (navView === n[0] ? 'on' : '') + '"' + (navView === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + (n[2] ? '<span class="count ' + (n[3] || '') + '">' + n[2] + '</span>' : '') + '</a>';
    }).join('');

    var v = $('#view');
    if (view === 'record') {
      var ctx = ctxs.filter(function (c) { return c.isrc === state.ui.rec; })[0];
      if (!ctx) { v.innerHTML = '<div class="empty"><h2>That record is not here</h2><p>It may have been removed, or the data is still loading.</p><a class="btn" href="#/records">Back to records</a></div>'; }
      else { v.innerHTML = viewRecord(ctx); }
    } else if (view === 'sort') v.innerHTML = viewSort(untagged);
    else v.innerHTML = viewRecords(items);
    document.body.classList.toggle('wide', view === 'records');
    renderModal();
  }

  // ---- records list
  var TREND = {
    accelerating: { label: 'Accelerating', cls: 'acc', icon: '<path d="M3 11l4-4 3 3 4-5M10 5h4v4" />' },
    plateauing: { label: 'Plateauing', cls: 'pla', icon: '<path d="M2 8h12M11 5l3 3-3 3" />' },
    declining: { label: 'Declining', cls: 'dec', icon: '<path d="M3 5l4 4 3-3 4 5M10 11h4V7" />' },
    early: { label: 'Too early to call', cls: 'early', icon: '<path d="M8 3v5l3 2" /><circle cx="8" cy="8" r="6" />' },
    nodata: { label: 'No data yet', cls: 'early', icon: '<path d="M8 3v5l3 2" /><circle cx="8" cy="8" r="6" />' }
  };
  function trendBadge(tr, big) {
    var t = TREND[tr.state] || TREND.nodata;
    return '<span class="trend ' + t.cls + (big ? ' big' : '') + '"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + t.icon + '</svg>' +
      '<span>' + t.label + (tr.pct != null && (tr.state === 'accelerating' || tr.state === 'declining' || tr.state === 'plateauing') ? ' ' + (tr.pct >= 0 ? '+' : '') + tr.pct + '%' : '') + '</span></span>';
  }
  function sparkSvg(values, cls) {
    if (!values || values.length < 2) return '<span class="muted" style="font-size:13px">No daily data</span>';
    var w = 110, hgt = 32, min = Math.min.apply(null, values), max = Math.max.apply(null, values), span = max - min || 1;
    var pts = values.map(function (v, i) { return (i / (values.length - 1) * (w - 4) + 2).toFixed(1) + ',' + (hgt - 3 - (v - min) / span * (hgt - 6)).toFixed(1); }).join(' ');
    return '<svg class="spark ' + cls + '" viewBox="0 0 ' + w + ' ' + hgt + '" width="' + w + '" height="' + hgt + '" role="img" aria-label="Daily Spotify streams, last ' + values.length + ' days"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  var TREND_RANK = { accelerating: 0, plateauing: 1, early: 2, nodata: 3, declining: 4 };
  // ---- records: one table to scan, then every record in full below it (no tabs)
  var COLS = [
    ['streams', 'Streams'], ['editorial', 'Editorial'], ['shazams', 'Shazams'],
    ['radio_plays', 'Radio'], ['dj_supports', 'DJ supports'], ['tiktok_videos', 'TikTok videos']
  ];
  var PERIOD_LABEL = { latest: 'Last 7 days', week: 'Last full release week', since: 'Since release' };
  function periodMode() { return state.ui.period || 'latest'; }
  function pctTag(w) {
    if (w && w.since) return w.cur != null ? '' : '<span class="d0">no data yet</span>';
    if (!w || w.cur == null || (!w.cur && !w.total)) return '<span class="d0">no data yet</span>';
    if (w.first) return '<span class="dn">first week</span>';
    if (w.noPrev) return '<span class="d0" title="Songstats has no data for the week before, usually because it started tracking this record late">no earlier data</span>';
    if (w.pct == null) return '<span class="d0">-</span>';
    return '<span class="' + (w.pct >= 10 ? 'du' : w.pct <= -10 ? 'dd' : 'd0') + '">' + (w.pct > 0 ? '+' : '') + w.pct + '%</span>';
  }
  function short(n) { return n == null ? '-' : C.fmtCompact(n) || '0'; }
  function recInfo(ctx) {
    var P = C.periodFor(ctx, periodMode()), mon = C.monitor(ctx);
    var strip = C.stripFor(ctx, P), by = {};
    strip.forEach(function (m) { by[m.key] = m; });
    var ed = C.editorialOnly(ctx.placements).filter(C.activeNow);
    var news = C.periodNews(ctx, P);
    var notes = C.notes(ctx, P);
    var top = null;
    notes.forEach(function (g) { g.items.forEach(function (i) { if (!top && i.fresh) top = i.text; }); });
    return { ctx: ctx, P: P, mon: mon, strip: strip, by: by, ed: ed, news: news, notes: notes, top: top };
  }
  function relSub(ctx) {
    if (ctx.release == null) return 'No release date yet';
    var w = C.weekOf(ctx.release, today());
    return w < 1 ? 'Out ' + C.fmtLong(ctx.release) : 'Week ' + w + ', out ' + C.fmtShort(ctx.release);
  }
  function sortInfos(infos) {
    var how = state.ui.sort, v = function (i, k) { var m = i.by[k]; return m && m.w && m.w.pct != null ? m.w.pct : -1e9; };
    if (how === 'newest') infos.sort(function (a, b) { return (b.ctx.release || 0) - (a.ctx.release || 0); });
    else if (how === 'trend') infos.sort(function (a, b) { return TREND_RANK[a.mon.trend.state] - TREND_RANK[b.mon.trend.state] || (b.mon.trend.pct || 0) - (a.mon.trend.pct || 0); });
    else if (how === 'editorial') infos.sort(function (a, b) { return b.news.editorial.length - a.news.editorial.length || b.ed.length - a.ed.length; });
    else infos.sort(function (a, b) { return v(b, how) - v(a, how); });
    return infos;
  }
  function viewRecords(items) {
    var c = cfg(), mode = periodMode();
    var head = '<div class="page-head"><div><h1>Records</h1><p class="lede">' + (state.history.generated_at ? 'Updates every morning from Songstats. Last update ' + ago(state.history.generated_at) + '.' : 'Updates every morning once the first refresh has run.') + '</p></div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg" role="group" aria-label="Period">' + ['latest', 'week', 'since'].map(function (m) {
        return '<button type="button" class="seg-btn" data-act="setPeriod" data-mode="' + m + '" aria-pressed="' + (mode === m) + '"><span>' + PERIOD_LABEL[m] + '</span></button>';
      }).join('') + '</div><button class="btn primary" data-act="openAdd">Add records</button></div></div>';
    var banner = !c.token ? '<div class="callout"><span>GitHub is not connected yet, so you can look around but not add records or save changes.</span><button class="btn small" data-act="openSettings">Connect GitHub</button></div>' : '';
    if (!items.length) return head + banner + '<div class="empty"><h2>Add your first records</h2><p>Paste Spotify track links, one per line.</p><button class="btn primary" data-act="openAdd">Add records</button></div>';
    var pend = items.filter(function (i) { return i.pending; }).map(function (i) { return recRow(i); }).join('');
    var infos = sortInfos(items.filter(function (i) { return !i.pending; }).map(recInfo));
    state.ui._infos = infos;
    var h = function (k, l) { return '<button class="th' + (state.ui.sort === k ? ' on' : '') + '" data-act="setSort" data-k="' + k + '">' + l + (state.ui.sort === k ? ' ↓' : '') + '</button>'; };
    var lagDays = infos.length ? Math.max.apply(null, infos.map(function (i) { return i.P.lag || 0; })) : 0;

        return { name: r.name + (r.type === 'SiriusXM' ? ' (SiriusXM)' : ''), fresh: inPer(r.first, P), sub: [r.plays + ' play' + (r.plays === 1 ? '' : 's'), r.cc || '', 'since ' + C.fmtShort(C.parseDate(r.first))].filter(Boolean).join(' · ') };

      })) +
      listBox(ctx.isrc + ':charts', 'Charts', '', dspCharts.map(function (m) { return { name: m.label, fresh: m.isNew || m.delta > 0, sub: '#' + m.position + (m.isNew ? ' · new' : m.delta ? (m.delta > 0 ? ' · up ' : ' · down ') + Math.abs(m.delta) : '') }; })
        .concat(sz.map(function (c) { return { name: 'Shazam ' + (c.city || c.genre || '') + ' ' + (c.country_code || ''), fresh: c.previous_position == null, sub: '#' + c.position }; }))

      (ctx.errors && ctx.errors.length ? '<div class="callout" title="' + esc(ctx.errors.join('\n')) + '"><span>' + plural(ctx.errors.length, 'item') + ' could not be refreshed last time. Older data is shown where possible.</span></div>' : '') +
      strip +
      '<div class="sh-grid"><div class="pbox notes"><div class="box-h"><h3>Pitch notes</h3><button class="btn primary small" data-act="copyNotes" data-isrc="' + esc(ctx.isrc) + '">Copy notes</button></div>' +
      '<p class="muted hint">' + (P.mode === 'since' ? 'Every true, positive point since release. Switch to Last 7 days or Last full release week to see what\'s new.' : 'Every true, positive point. <b>Bold</b> is new in ' + esc(P.label) + ' and stays bold when pasted.') + ' Tick the points you want, then copy.</p><div class="ticks">Tick: <button class="more-btn" data-act="tickSet" data-isrc="' + esc(nkey) + '" data-w="all">all</button> · ' + (P.mode === 'since' ? '' : '<button class="more-btn" data-act="tickSet" data-isrc="' + esc(nkey) + '" data-w="new">new only</button> · ') + '<button class="more-btn" data-act="tickSet" data-isrc="' + esc(nkey) + '" data-w="none">none</button></div>' + notesHtml + '</div>' +

  // notes text for the clipboard: Artist 'Title' - LABEL, links, period header, bullets. New points bold in the rich copy.
