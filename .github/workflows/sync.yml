name: Sync editorial pitch data

on:
  schedule:
    - cron: '15 6 * * *'      # daily, 06:15 UTC. Spot On Track bills per unique ISRC per month, so daily costs nothing extra.
  workflow_dispatch:
    inputs:
      isrc:
        description: 'Only sync this ISRC or track link (leave blank for every tracked record)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Run sync
        env:
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          ONLY_ISRC: ${{ github.event.inputs.isrc }}
        run: python scripts/sync.py

      - name: Commit data
        run: |
          git config user.name "editorial-pitch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/resolved.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "Sync data"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep 4
          done
          echo "Could not push after 5 tries"; exit 1
